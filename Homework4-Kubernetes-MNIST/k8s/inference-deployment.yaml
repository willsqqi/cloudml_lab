apiVersion: apps/v1
kind: Deployment
metadata:
  name: mnist-inference
  namespace: homework4
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: mnist-inference
  template:
    metadata:
      labels:
        app: mnist-inference
    spec:
      restartPolicy: Always
      containers:
        - name: inference
          image: us-central1-docker.pkg.dev/PROJECT_ID/homework4/inference:v2
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: "1"
              memory: 2Gi
              ephemeral-storage: 1Gi
            limits:
              cpu: "1"
              memory: 2Gi
              ephemeral-storage: 1Gi
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 60
            periodSeconds: 10
          volumeMounts:
            - name: model
              mountPath: /model
              readOnly: true
      volumes:
        - name: model
          persistentVolumeClaim:
            claimName: mnist-model
            readOnly: true
